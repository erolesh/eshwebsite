<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager – ESH Haustechnik</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Decap CMS manuelle Initialisierung verhindert doppeltes init -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Netlify Identity: Redirect nach Login zurück zu /admin/
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function(user) {
          if (!user) {
            window.netlifyIdentity.on('login', function() {
              document.location.href = '/admin/';
            });
          }
        });
      }

      // Decap CMS explizit initialisieren (nur einmal)
      if (window.CMS) {
        window.CMS.init();
      } else {
        console.error('Decap CMS konnte nicht geladen werden.');
        document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif;">❌ Fehler: Decap CMS konnte nicht geladen werden. Bitte prüfe die Browser-Konsole (F12 → Console).</p>';
      }
    </script>
  </body>
</html>
